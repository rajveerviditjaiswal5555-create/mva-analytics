# Render Blueprint — deploy this repo to get:
#   https://mva-analytics.onrender.com
# In Render Dashboard: New + → Blueprint → select this repository.

services:
  - type: web
    name: mva-analytics
    runtime: docker
    # Free tier sleeps after ~15 min idle. Change `free` to `starter` for always-on (paid).
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Set the Postgres EXTERNAL connection URL here in Render (never in Git).
      # If unset, the app falls back to SQLite inside the container.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # AI assistant key — set the real value in Render dashboard (not in Git).
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: qwen/qwen3.8-27b
      - key: ALLOWED_ORIGINS
        value: https://mva-analytics.onrender.com
      - key: DEMO_RECORD_TARGET
        value: "16500"
      - key: SESSION_TTL_HOURS
        value: "12"

databases:
  - name: mva-db
    plan: free
    region: singapore
    databaseName: mva
    user: mva
